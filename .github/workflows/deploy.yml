name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # 发版（打 v* tag）时自动重新构建站点，让「最新版本」徽标跟随 Releases 更新
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 获取最新版本号（从 GitHub Releases）
        id: version
        run: |
          TAG=$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/PupurinOfficial/PupurinLoom/releases/latest" \
            | jq -r '.tag_name // empty' 2>/dev/null) || true
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: 构建站点
        run: npm run build
        env:
          PUBLIC_APP_VERSION: ${{ steps.version.outputs.version }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
