# 铃言织机° (Pupurin° Loom) — 打包配置
appId: com.pupurin.loom
productName: 铃言织机°
copyright: Copyright © 2026 仆仆铃°工作室

directories:
  buildResources: build
  output: release

# 使用本地已下载的 Electron 发行版，避免打包时从 GitHub 重新下载
electronDist: node_modules/electron/dist

files:
  - out/**/*
  - "!**/*.map"

# 应用外资源（不进入 asar，运行时通过 process.resourcesPath 访问）
extraResources:
  # Python 后端源码（回退方案：无内置二进制时用系统 python3 运行）
  - from: python
    to: python
    filter: ["*.py", "sample_game/**", "requirements.txt", "!dist/**", "!build/**", "!.venv/**", "!__pycache__/**"]
  # Ren'Py 项目模板
  - from: a new Pupurin Loom game
    to: a new Pupurin Loom game

# macOS 平台专用
mac:
  target:
    - target: dmg
    - target: zip
  category: public.app-category.developer-tools
  # 标准 icns（按 PupurinLoom_icon.icon 设计合成：白→浅橙渐变 + LOGO）
  icon: build/icon.icns
  # 无 Apple Developer 证书时跳过签名（保持 ad-hoc 可用）
  identity: null
  extraResources:
    # Python 后端可执行文件（PyInstaller 单文件，arm64）
    - from: python/dist/pupurin-backend
      to: bin/pupurin-backend

# Windows 平台
win:
  target:
    - target: nsis
  icon: build/icon.ico
  extraResources:
    # Python 后端可执行文件（PyInstaller 单文件，Windows）
    - from: python/dist/pupurin-backend.exe
      to: bin/pupurin-backend.exe

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  artifactName: "${productName}-${version}-setup.${ext}"

dmg:
  artifactName: "${productName}-${version}.${ext}"
  # 安装引导背景：不显式指定 background，由 electron-builder 自动从 buildResourcesDir(build/) 探测
  # background.tiff / background.png（@2x 自动适配 Retina），显式指定反而会按项目根目录解析导致找不到
  window:
    width: 660
    height: 371
  contents:
    - x: 165
      y: 185
    - x: 495
      y: 185
      type: link
      path: /Applications
